---
namespace: degitag
name: monitoring
version: 2.0.0
readme: README.md
authors:
- Dominik Lenhardt <dominik@lenmail.de>
description: Collection with monitoring roles for exporters, metrics storage, logging, and dashboards.
license:
- MIT
tags:
- monitoring
- observability
- prometheus
- grafana
- linux
dependencies:
  community.general: '>=13.0.0,<14.0.0'
  ansible.posix: '>=2.1.0,<3.0.0'
  community.crypto: '>=3.0.0,<4.0.0'
  ansible.windows: '>=3.0.0,<4.0.0'
  community.grafana: '>=2.0.0,<3.0.0'
repository: https://github.com/OnkelDom/ansible-collection-monitoring
documentation: https://github.com/OnkelDom/ansible-collection-monitoring
issues: https://github.com/OnkelDom/ansible-collection-monitoring/issues
build_ignore:
- molecule
- tests
- .github
- dev_notes
- tools
- .venv
- .pytest_cache
- .ansible
- docs/validation
- '*.tar.gz'
- AGENTS.md
- requirements-test.txt
- .gitignore
- .ansible-lint.yml
- ansible.cfg
- CHANGELOG.md
- docs
- roles/*/tests
- .host-collection
- .venv-v2
- Makefile
- CONTRIBUTING.md
- SECURITY.md
- .editorconfig
- .yamllint
- .yamllint.yml
- requirements-dev.yml
- .DS_Store
- '**/.DS_Store'
