---
name: Release
on:
  push:
    tags: [v*]
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  release:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.12'
    - name: Install build tools and verify the explicit tag
      env:
        RELEASE_TAG: ${{ github.ref_name }}
      run: |
        python -m pip install -r requirements-test.txt
        test "$RELEASE_TAG" = "v$(python tools/collection_metadata.py version)"
    - name: Build and inspect the release artifact
      run: |
        ansible-galaxy collection build --force
        artifact=$(python tools/collection_metadata.py artifact)
        python tools/check_collection_artifact.py "$artifact"
        python tools/check_monitoring_artifact.py "$artifact"
    - name: Create the GitHub release with the verified artifact
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ github.ref_name }}
      run: |
        artifact=$(python tools/collection_metadata.py artifact)
        gh release create "$RELEASE_TAG" "$artifact" --verify-tag --generate-notes
