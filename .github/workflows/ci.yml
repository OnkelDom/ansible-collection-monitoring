---
name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Validate / core ${{ matrix.core }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        core: ['2.20', '2.21']
    env:
      ANSIBLE_HOME: ${{ github.workspace }}/.ansible
      ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/.ansible/collections
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: requirements-test.txt
    - name: Install controller dependencies
      run: |
        python -m pip install -r requirements-test.txt
        python -m pip install 'ansible-core~=${{ matrix.core }}.0'
        ansible-galaxy collection install -r requirements.yml
    - name: Run the shared repository and monitoring checks
      run: bash tests/run_checks.sh
    - name: Resolve the checked artifact name
      id: metadata
      run: echo "artifact=$(python tools/collection_metadata.py artifact)" >> "$GITHUB_OUTPUT"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: matrix.core == '2.21'
      with:
        name: collection
        path: ${{ steps.metadata.outputs.artifact }}
        retention-days: 14
