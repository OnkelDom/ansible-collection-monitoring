---
name: CI
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Validate / core ${{ matrix.core }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        core:
        - '2.20'
        - '2.21'
    env:
      ANSIBLE_HOME: ${{ github.workspace }}/.ansible
      ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/.ansible/collections
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: requirements-test.txt
    - name: Install controller dependencies
      run: 'python -m pip install -r requirements-test.txt

        python -m pip install ''ansible-core~=${{ matrix.core }}.0''

        ansible-galaxy collection install -r requirements.yml

        '
    - name: Check role contracts and unit tests
      run: 'python tools/generate_role_scaffold.py --check

        pytest tests/unit -q

        yamllint .

        '
    - name: Build and install collection
      run: 'ansible-galaxy collection build --force

        python tools/check_collection_artifact.py degit-monitoring-*.tar.gz

        ansible-galaxy collection install degit-monitoring-*.tar.gz --force

        '
    - name: Run collection sanity checks
      run: bash tests/run_collection_sanity.sh degit-monitoring-*.tar.gz monitoring
    - name: Exercise installed platform contracts without host changes
      run: python tests/run_preflight_checks.py
    - name: Validate neutral LPM and native PVE rules
      run: 'python tests/install_monitoring_test_tools.py --dest "$RUNNER_TEMP/monitoring-tools"

        python tests/run_lpm_checks.py --promtool "$RUNNER_TEMP/monitoring-tools/promtool" --amtool "$RUNNER_TEMP/monitoring-tools/amtool"

        PROMTOOL="$RUNNER_TEMP/monitoring-tools/promtool" python tests/run_proxmox_checks.py

        '
    - name: Check syntax and Ansible lint
      run: 'bash tests/run_role_syntax_checks.sh

        ansible-lint --offline

        '
    - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
      if: matrix.core == '2.21'
      with:
        name: collection
        path: degit-monitoring-*.tar.gz
        retention-days: 14
'on':
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
