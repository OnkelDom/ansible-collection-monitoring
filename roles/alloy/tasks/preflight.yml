---
- name: Collect missing Linux platform facts
  ansible.builtin.setup: {}
  when:
  - "['architecture', 'distribution', 'distribution_major_version', 'distribution_version', 'hostname', 'os_family', 'selinux'] | difference(ansible_facts.keys()) | length > 0"
  - ansible_connection | default('ssh') not in ['winrm', 'psrp']
  - ansible_facts.get('os_family', '') != 'Windows'
- name: Collect missing Windows platform facts
  ansible.windows.setup: {}
  when:
  - "['os_family', 'architecture', 'distribution', 'distribution_version'] | difference(ansible_facts.keys()) | length > 0"
  - ansible_connection | default('ssh') in ['winrm', 'psrp'] or ansible_facts.get('os_family', '') == 'Windows'
- name: Validate the supported operating system release
  ansible.builtin.assert:
    that:
    - (ansible_facts['distribution'] == 'Debian' and ansible_facts['distribution_major_version'] == '13') or (ansible_facts['distribution'] == 'Ubuntu' and ansible_facts['distribution_version'] in ['22.04', '24.04', '26.04']) or (ansible_facts['distribution'] in ['Rocky', 'RedHat'] and ansible_facts['distribution_major_version'] == '9') or ansible_facts['os_family'] == 'Windows'
    fail_msg: Unsupported or unimplemented role/platform combination for alloy. See the role README.
    quiet: true
- name: Load family platform variables
  ansible.builtin.include_vars:
    file: "{{ role_path }}/vars/platform/{{ ansible_facts['os_family'] }}.yml"
- name: Load distribution platform variables
  ansible.builtin.include_vars:
    file: "{{ role_path }}/vars/platform/{{ ansible_facts['distribution'] }}.yml"
  when: ansible_facts['os_family'] != 'Windows' and ansible_facts['distribution'] != ansible_facts['os_family']
- name: Load release platform variables
  ansible.builtin.include_vars: '{{ item }}'
  with_first_found:
  - files:
    - "{{ ansible_facts['distribution'] }}-{{ ansible_facts['distribution_version'] }}.yml"
    - "{{ ansible_facts['distribution'] }}-{{ ansible_facts['distribution_major_version'] }}.yml"
    paths:
    - '{{ role_path }}/vars/platform'
    skip: true
