---
- name: Validate supported platform
  ansible.builtin.assert:
    that:
    - ansible_facts.os_family in ["Debian", "RedHat"]
    fail_msg: The alloy role supports Debian and RedHat families only.
  tags:
  - alloy
- name: Ensure apt keyring directory exists for Grafana Alloy
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true
  when:
  - ansible_facts.os_family == "Debian"
  - alloy_manage_repository | bool
  tags:
  - alloy
  - alloy-install
- name: Download Grafana repository key for Alloy
  ansible.builtin.get_url:
    url: '{{ alloy_repository_key_url }}'
    dest: '{{ alloy_repository_keyring }}'
    owner: root
    group: root
    mode: '0644'
  become: true
  when:
  - ansible_facts.os_family == "Debian"
  - alloy_manage_repository | bool
  tags:
  - alloy
  - alloy-install
- name: Install the deb822 Python parser
  ansible.builtin.apt:
    name: python3-debian
    state: present
  when:
  - ansible_facts.os_family == 'Debian'
  - alloy_manage_repository | bool
  become: true
- name: Configure the signed Grafana deb822 repository
  become: true
  when:
  - ansible_facts.os_family == "Debian"
  - alloy_manage_repository | bool
  tags:
  - alloy
  - alloy-install
  ansible.builtin.deb822_repository:
    name: grafana
    types:
    - deb
    uris:
    - '{{ alloy_repository_url }}'
    suites:
    - stable
    components:
    - main
    signed_by: '{{ alloy_repository_keyring }}'
    state: present
  register: _alloy_apt_repository
- name: Refresh package metadata after adding Grafana repository
  ansible.builtin.apt:
    update_cache: true
  when:
  - ansible_facts.os_family == 'Debian'
  - alloy_manage_repository | bool
  - _alloy_apt_repository is changed
  become: true
- name: Configure the signed Grafana RPM repository
  ansible.builtin.yum_repository:
    name: grafana
    description: Grafana stable packages
    baseurl: '{{ alloy_rpm_repository_url }}'
    gpgkey: '{{ alloy_rpm_repository_key_url }}'
    gpgcheck: true
    repo_gpgcheck: true
    sslverify: true
    enabled: true
  when:
  - ansible_facts.os_family == 'RedHat'
  - alloy_manage_repository | bool
  become: true
- name: Install SELinux tooling for alloy
  ansible.builtin.package:
    name: '{{ alloy_selinux_packages }}'
    state: present
    policy_rc_d: '{{ 101 if ansible_facts.os_family == ''Debian'' and not (alloy_manage_service | bool and alloy_service_state == ''started'') else omit }}'
  become: true
  when:
  - ansible_facts.os_family == "RedHat"
  - alloy_manage_selinux | bool
  - ansible_facts.selinux is defined
  - ansible_facts.selinux.status == "enabled"
  tags:
  - alloy
  - alloy-firewall
- name: Install Grafana Alloy package
  ansible.builtin.package:
    name: '{{ alloy_package_name }}'
    state: present
    policy_rc_d: '{{ 101 if ansible_facts.os_family == ''Debian'' and not (alloy_manage_service | bool and alloy_service_state == ''started'') else omit }}'
  become: true
  notify: Start alloy
  tags:
  - alloy
  - alloy-install
- name: Create alloy configuration directory
  ansible.builtin.file:
    path: '{{ alloy_config_dir }}'
    state: directory
    owner: '{{ alloy_user }}'
    group: '{{ alloy_group }}'
    mode: '0755'
  become: true
  tags:
  - alloy
  - alloy-config
- name: Create alloy data directory
  ansible.builtin.file:
    path: '{{ alloy_data_dir }}'
    state: directory
    owner: '{{ alloy_user }}'
    group: '{{ alloy_group }}'
    mode: '0755'
  become: true
  tags:
  - alloy
  - alloy-config
- name: Generate alloy configuration file
  ansible.builtin.template:
    src: config.alloy.j2
    dest: '{{ alloy_config_file }}'
    owner: '{{ alloy_user }}'
    group: '{{ alloy_group }}'
    mode: '0644'
    backup: true
    validate: '{{ alloy_binary_path ~ '' validate %s'' if alloy_validate_config else omit }}'
  become: true
  notify: Restart alloy
  tags:
  - alloy
  - alloy-config
  no_log: true
- name: Create systemd service override directory
  ansible.builtin.file:
    path: /etc/systemd/system/{{ alloy_service_name }}.service.d
    state: directory
    mode: '0755'
  become: true
  when: alloy_service_override | length > 0
  tags:
  - alloy
  - alloy-service
- name: Create systemd service override file
  ansible.builtin.template:
    src: systemd-override.conf.j2
    dest: /etc/systemd/system/{{ alloy_service_name }}.service.d/override.conf
    mode: '0644'
  become: true
  when: alloy_service_override | length > 0
  notify:
  - Restart alloy
  tags:
  - alloy
  - alloy-service
- name: Manage alloy ports through the firewall role
  ansible.builtin.include_role:
    name: degit.infrastructure.firewall
    apply:
      tags: &id001
      - alloy
      - alloy-firewall
  vars:
    firewall_manage_activation: false
    firewall_rules:
    - port: '{{ _alloy_firewall_port.split(''/'')[0] }}'
      protocol: '{{ _alloy_firewall_port.split(''/'')[1] | default(''tcp'') }}'
      action: allow
      comment: alloy
      zone: '{{ alloy_firewall_zone | default("public") }}'
  loop: '{{ alloy_firewall_ports }}'
  loop_control:
    loop_var: _alloy_firewall_port
  when:
  - alloy_manage_firewall | bool or alloy_firewall_enabled | bool
  - alloy_firewall_ports | length > 0
  tags: *id001
- name: Configure SELinux ports for alloy
  community.general.seport:
    ports: '{{ item.split(''/'')[0] }}'
    proto: '{{ item.split(''/'')[1] }}'
    setype: '{{ alloy_selinux_port_type }}'
    state: present
  loop: '{{ alloy_selinux_ports }}'
  become: true
  when:
  - ansible_facts.os_family == "RedHat"
  - alloy_manage_selinux | bool
  - ansible_facts.selinux is defined
  - ansible_facts.selinux.status == "enabled"
  - alloy_selinux_ports | length > 0
  tags:
  - alloy
  - alloy-firewall
- name: Start and enable alloy service
  ansible.builtin.systemd:
    name: '{{ alloy_service_name }}'
    state: '{{ alloy_service_state }}'
    enabled: '{{ alloy_service_enabled }}'
    daemon_reload: true
  become: true
  when:
  - alloy_manage_service | bool
  tags:
  - alloy
  - alloy-service
- name: Verify alloy service status
  ansible.builtin.systemd:
    name: '{{ alloy_service_name }}'
  register: alloy_service_status
  become: true
  tags:
  - alloy
  - alloy-verify
  when:
  - alloy_manage_service | bool
