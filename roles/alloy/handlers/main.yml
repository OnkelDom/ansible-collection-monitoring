---
- name: Restart alloy
  ansible.builtin.systemd:
    name: '{{ alloy_service_name }}'
    state: restarted
    daemon_reload: true
  become: true
  when:
  - _alloy_service_policy.manage | default(false) | bool
  - (_alloy_service_policy.state | default('stopped')) != 'stopped'
  - ansible_facts.os_family != 'Windows'
- name: Reload alloy
  ansible.builtin.systemd:
    name: '{{ alloy_service_name }}'
    state: reloaded
  become: true
  when:
  - _alloy_service_policy.manage | default(false) | bool
  - (_alloy_service_policy.state | default('stopped')) != 'stopped'
  - ansible_facts.os_family != 'Windows'
- name: Start alloy
  ansible.builtin.systemd:
    name: '{{ alloy_service_name }}'
    state: started
    enabled: '{{ _alloy_service_policy.enabled | default(false) }}'
  become: true
  when:
  - _alloy_service_policy.manage | default(false) | bool
  - (_alloy_service_policy.state | default('stopped')) != 'stopped'
  - ansible_facts.os_family != 'Windows'
- name: Restart alloy on Windows
  ansible.windows.win_service:
    name: '{{ alloy_service_name }}'
    state: restarted
  when:
  - ansible_facts.os_family == 'Windows'
  - _alloy_service_policy.manage | default(false) | bool
  - (_alloy_service_policy.state | default('stopped')) != 'stopped'
