---
- name: reload systemd_exporter
  become: true
  tags: systemd_exporter
  when:
  - _systemd_exporter_service_policy.manage | default(false) | bool
  - (_systemd_exporter_service_policy.state | default('stopped')) != 'stopped'
  ansible.builtin.systemd_service:
    name: systemd_exporter
    state: reloaded
- name: restart systemd_exporter
  become: true
  tags: systemd_exporter
  when:
  - _systemd_exporter_service_policy.manage | default(false) | bool
  - (_systemd_exporter_service_policy.state | default('stopped')) != 'stopped'
  ansible.builtin.systemd_service:
    daemon_reload: true
    name: systemd_exporter
    state: restarted
