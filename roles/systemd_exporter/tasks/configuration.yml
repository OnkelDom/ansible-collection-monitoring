---
- name: Capture the requested service policy for deferred handlers
  ansible.builtin.set_fact:
    _systemd_exporter_service_policy:
      manage: '{{ systemd_exporter_manage_service | bool }}'
      state: '{{ systemd_exporter_service_state }}'
      enabled: '{{ systemd_exporter_service_enabled | bool }}'
- name: create system group
  when: systemd_exporter_system_group != "root"
  become: true
  tags: systemd_exporter
  ansible.builtin.group:
    name: '{{ systemd_exporter_system_group }}'
    system: true
    state: present
- name: create system user
  when: systemd_exporter_system_user != "root"
  become: true
  tags: systemd_exporter
  ansible.builtin.user:
    name: '{{ systemd_exporter_system_user }}'
    system: true
    shell: /sbin/nologin
    group: '{{ systemd_exporter_system_group }}'
    groups: '{{ systemd_exporter_user_additional_groups }}'
    createhome: false
    append: true
- name: Create versioned release cache
  ansible.builtin.file:
    path: '{{ _systemd_exporter_download_dir }}/systemd_exporter-{{ systemd_exporter_version }}.linux-{{ go_arch }}'
    state: directory
    owner: root
    group: root
    mode: '0755'
- name: Download checksum-verified release on the target
  ansible.builtin.get_url:
    url: https://github.com/prometheus-community/systemd_exporter/releases/download/v{{ systemd_exporter_version }}/systemd_exporter-{{ systemd_exporter_version }}.linux-{{ go_arch }}.tar.gz
    dest: '{{ _systemd_exporter_download_dir }}/systemd_exporter-{{ systemd_exporter_version }}.linux-{{ go_arch }}.tar.gz'
    checksum: sha256:https://github.com/prometheus-community/systemd_exporter/releases/download/v{{ systemd_exporter_version }}/sha256sums.txt
    mode: '0644'
  environment: '{{ proxy_env }}'
  register: _release_download
  until: _release_download is succeeded
  retries: 3
  delay: 2
- name: Extract the selected release
  ansible.builtin.unarchive:
    src: '{{ _systemd_exporter_download_dir }}/systemd_exporter-{{ systemd_exporter_version }}.linux-{{ go_arch }}.tar.gz'
    dest: '{{ _systemd_exporter_download_dir }}/systemd_exporter-{{ systemd_exporter_version }}.linux-{{ go_arch }}'
    remote_src: true
    creates: '{{ _systemd_exporter_download_dir }}/systemd_exporter-{{ systemd_exporter_version }}.linux-{{ go_arch }}/systemd_exporter-{{ systemd_exporter_version }}.linux-{{ go_arch }}/systemd_exporter'
- name: Install the selected release binary
  ansible.builtin.copy:
    src: '{{ _systemd_exporter_download_dir }}/systemd_exporter-{{ systemd_exporter_version }}.linux-{{ go_arch }}/systemd_exporter-{{ systemd_exporter_version }}.linux-{{ go_arch }}/systemd_exporter'
    dest: '{{ systemd_exporter_binary_install_dir }}/systemd_exporter'
    remote_src: true
    owner: root
    group: root
    mode: '0755'
  notify: restart systemd_exporter
- name: create systemd service unit
  notify: restart systemd_exporter
  become: true
  tags: systemd_exporter
  ansible.builtin.template:
    src: systemd_exporter.service.j2
    dest: /etc/systemd/system/systemd_exporter.service
    owner: root
    group: root
    mode: '0644'
- name: ensure service is started and enabled
  become: true
  tags: systemd_exporter
  when:
  - systemd_exporter_manage_service | bool
  ansible.builtin.systemd_service:
    daemon_reload: true
    name: systemd_exporter
    state: '{{ systemd_exporter_service_state }}'
    enabled: '{{ systemd_exporter_service_enabled }}'
