---
- become: false
  delegate_to: localhost
  run_once: true
  tags: grafana
  block:
  - name: Create local grafana dashboard directory
    tempfile:
      state: directory
    register: _tmp_dashboards
    changed_when: false
    check_mode: false
    tags: grafana
  - name: download grafana dashboard from grafana.net to local directory
    args:
      creates: '{{ _tmp_dashboards.path }}/{{ item.dashboard_id }}.json'
    register: _download_dashboards
    until: _download_dashboards is succeeded
    retries: 5
    delay: 2
    with_items: '{{ grafana_dashboards }}'
    when: grafana_dashboards | length > 0
    changed_when: false
    check_mode: false
    tags:
    - skip_ansible_lint
    - grafana
    ansible.builtin.command: 'curl --fail --compressed https://grafana.com/api/dashboards/{{ item.dashboard_id }}/revisions/{{ item.revision_id }}/download -o {{ _tmp_dashboards.path }}/{{ item.dashboard_id }}.json

      '
  - name: Set the correct data source name in the dashboard
    changed_when: false
    with_items: '{{ grafana_dashboards }}'
    when: grafana_dashboards | length > 0
    tags: grafana
    ansible.builtin.replace:
      dest: '{{ _tmp_dashboards.path }}/{{ item.dashboard_id }}.json'
      regexp: '"(?:\${)?DS_[A-Z0-9_-]+(?:})?"'
      replace: '"{{ item.datasource }}"'
- name: Import grafana dashboards through API
  no_log: true
  with_fileglob:
  - '{{ _tmp_dashboards.path }}/*'
  - '{{ grafana_dashboards_dir }}/*.json'
  when:
  - not grafana_use_provisioning
  - (item | basename) != 'proxmox-native.json' and not (item is search('[.]provenance[.]json$'))
  tags: grafana
  ansible.builtin.uri:
    url: '{{ grafana_api_url }}/api/dashboards/db'
    user: '{{ grafana_security.admin_user }}'
    password: '{{ grafana_security.admin_password }}'
    force_basic_auth: true
    method: POST
    body_format: json
    body: "{\n  \"dashboard\": {{ lookup(\"file\", item) }},\n  \"overwrite\": true,\n  \"message\": \"Updated by ansible\"\n}\n"
- when: grafana_use_provisioning
  block:
  - name: Remove metadata and the legacy generic PVE dashboard copy
    ansible.builtin.file:
      path: '{{ grafana_data_dir }}/dashboards/{{ item }}'
      state: absent
    loop:
    - proxmox-native.provenance.json
    - proxmox-native.json
    become: true
  - name: Create/Update dashboards file (provisioning)
    become: true
    notify: restart grafana
    tags: grafana
    ansible.builtin.copy:
      dest: /etc/grafana/provisioning/dashboards/ansible.yml
      content: "apiVersion: 1\nproviders:\n - name: 'default'\n   orgId: 1\n   folder: ''\n   type: file\n   options:\n     path: \"{{ grafana_data_dir }}/dashboards\"\n"
      backup: false
      owner: root
      group: grafana
      mode: '0640'
  - name: Register previously copied dashboards
    register: _dashboards_present
    when: grafana_provisioning_synced
    tags: grafana
    ansible.builtin.find:
      paths: '{{ grafana_data_dir }}/dashboards'
      hidden: true
      patterns:
      - '*.json'
  - name: Import grafana dashboards
    become: true
    with_fileglob:
    - '{{ _tmp_dashboards.path }}/*'
    - '{{ grafana_dashboards_dir }}/*.json'
    register: _dashboards_copied
    notify: provisioned dashboards changed
    tags: grafana
    ansible.builtin.copy:
      src: '{{ item }}'
      dest: '{{ grafana_data_dir }}/dashboards/{{ item | basename }}'
      mode: '0640'
      owner: grafana
      group: grafana
    when: (item | basename) != 'proxmox-native.json' and not (item is search('[.]provenance[.]json$'))
  - name: Get dashboard lists
    when: grafana_provisioning_synced
    tags: grafana
    ansible.builtin.set_fact:
      _dashboards_present_list: '{{ _dashboards_present | json_query(''files[*].path'') | default([]) }}'
      _dashboards_copied_list: '{{ _dashboards_copied | json_query(''results[*].dest'') | default([]) }}'
  - name: Remove dashboards not present on deployer machine (synchronize)
    become: true
    with_items: '{{ _dashboards_present_list | difference( _dashboards_copied_list ) }}'
    when: grafana_provisioning_synced
    tags: grafana
    ansible.builtin.file:
      path: '{{ item }}'
      state: absent
