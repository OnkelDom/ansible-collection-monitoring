---
- name: Capture the requested service policy for deferred handlers
  ansible.builtin.set_fact:
    _grafana_service_policy:
      manage: '{{ grafana_manage_service | bool }}'
      state: '{{ grafana_service_state }}'
      enabled: '{{ grafana_service_enabled | bool }}'
- name: Gather variables for each operating system
  with_first_found:
  - '{{ ansible_facts.distribution | lower }}-{{ ansible_facts.distribution_version | lower }}.yml'
  - '{{ ansible_facts.distribution | lower }}-{{ ansible_facts.distribution_major_version | lower }}.yml'
  - '{{ ansible_facts.os_family | lower }}-{{ ansible_facts.distribution_major_version | lower }}.yml'
  - '{{ ansible_facts.distribution | lower }}.yml'
  - '{{ ansible_facts.os_family | lower }}.yml'
  tags:
  - grafana_install
  - grafana_configure
  - grafana_datasources
  - grafana_notifications
  - grafana_dashboards
  - grafana
  ansible.builtin.include_vars: '{{ item }}'
- name: Include preflight tasks
  ansible.builtin.include_tasks: preflight.yml
  tags:
  - grafana_install
  - grafana_configure
  - grafana_datasources
  - grafana_notifications
  - grafana_dashboards
  - grafana
- name: Include installation tasks
  ansible.builtin.include_tasks:
    file: install.yml
    apply:
      become: true
  tags:
  - grafana_install
  - grafana
- name: Include configuration tasks
  ansible.builtin.include_tasks:
    file: configure.yml
    apply:
      become: true
  tags:
  - grafana_configure
  - grafana
- name: Include plugin tasks
  ansible.builtin.include_tasks: plugins.yml
  when: grafana_plugins != []
  tags:
  - grafana_configure
  - grafana
- name: Restart grafana before configuring datasources and dashboards
  tags:
  - grafana_install
  - grafana_configure
  - grafana_datasources
  - grafana_notifications
  - grafana_dashboards
  - grafana_run
  - grafana
  ansible.builtin.meta: flush_handlers
- name: Wait for grafana to start (http/s)
  when:
  - grafana_server.protocol is undefined or grafana_server.protocol in ['http', 'https']
  - grafana_manage_service | bool
  - grafana_service_state != 'stopped'
  tags:
  - grafana_install
  - grafana_configure
  - grafana_datasources
  - grafana_notifications
  - grafana_dashboards
  - grafana_run
  - grafana
  ansible.builtin.wait_for:
    host: '{{ grafana_address }}'
    port: '{{ grafana_port }}'
- name: Wait for grafana to start (socket)
  when:
  - grafana_server.protocol is defined and grafana_server.protocol == 'socket'
  - grafana_manage_service | bool
  - grafana_service_state != 'stopped'
  tags:
  - grafana_install
  - grafana_configure
  - grafana_datasources
  - grafana_notifications
  - grafana_dashboards
  - grafana_run
  - grafana
  ansible.builtin.wait_for:
    path: '{{ grafana_server.socket }}'
- name: Include API key tasks
  ansible.builtin.include_tasks: api_keys.yml
  when:
  - grafana_api_keys | length > 0
  - grafana_manage_service | bool
  - grafana_service_state != 'stopped'
  tags:
  - grafana_configure
  - grafana_run
  - grafana
- name: Include datasource tasks
  ansible.builtin.include_tasks: datasources.yml
  when:
  - grafana_datasources != []
  - grafana_manage_service | bool
  - grafana_service_state != 'stopped'
  tags:
  - grafana_configure
  - grafana_datasources
  - grafana_run
  - grafana
- name: Include notification tasks
  ansible.builtin.include_tasks: notifications.yml
  when:
  - grafana_alert_notifications | length > 0
  - grafana_manage_service | bool
  - grafana_service_state != 'stopped'
  tags:
  - grafana_configure
  - grafana_notifications
  - grafana_run
  - grafana
- name: Check if there are any dashboards in local {{ grafana_dashboards_dir }}
  become: false
  tags:
  - grafana_configure
  - grafana_dashboards
  - grafana_run
  - grafana
  ansible.builtin.set_fact:
    found_dashboards: '{{ lookup(''fileglob'', grafana_dashboards_dir + ''/*.json'', wantlist=True) }}'
- name: Include dashboard tasks
  ansible.builtin.include_tasks: dashboards.yml
  when: grafana_dashboards | length > 0 or found_dashboards | length > 0
  tags:
  - grafana_configure
  - grafana_dashboards
  - grafana_run
  - grafana
- name: Reconcile the native PVE dashboard
  ansible.builtin.import_tasks: proxmox_dashboard.yml
  tags: [grafana, grafana_dashboards]
