---
- block:
  - name: Update apt cache
    apt:
      update_cache: true
    register: _pre_update_apt_cache
    until: _pre_update_apt_cache is succeeded
    when: ansible_pkg_mgr == "apt"
    tags: grafana

  - name: Install dependencies
    package:
      name: "{{ grafana_dependencies }}"
      state: present
    register: _install_dep_packages
    until: _install_dep_packages is succeeded
    retries: 5
    delay: 2
    tags: grafana

- name: Remove conflicting grafana packages
  package:
    name: grafana-data
    state: absent
  register: _old_grafana_pkgs
  tags: grafana

- name: Clean apt cache
  ansible.builtin.command: apt clean
  when:
  - _old_grafana_pkgs is changed
  - ansible_pkg_mgr == "apt"
  tags: grafana
  changed_when: false

- name: Add Grafana repository file [RHEL/CentOS]
  template:
    src: "{{ grafana_yum_repo_template }}"
    dest: "/etc/yum.repos.d/{{ grafana_yum_repo_template | basename | regex_replace('\\.j2$', '') }}"
    force: true
    backup: true
    mode: "0644"
  tags: grafana
  when:
  - ansible_pkg_mgr in ['yum', 'dnf']
  - grafana_manage_repo

- block:
  - name: Ensure Grafana apt keyring directory exists [Debian/Ubuntu]
    file:
      path: /etc/apt/keyrings
      state: directory
      mode: "0755"
    tags: grafana

  - name: Install Grafana GPG signing key [Debian/Ubuntu]
    get_url:
      url: "https://packages.grafana.com/gpg.key"
      validate_certs: false
      dest: /etc/apt/keyrings/grafana.gpg
      mode: "0644"
    register: _install_apt_key
    until: _install_apt_key is succeeded
    retries: 5
    delay: 2
    tags: grafana

  - name: Add Grafana repository [Debian/Ubuntu]
    apt_repository:
      repo: deb [signed-by=/etc/apt/keyrings/grafana.gpg] https://packages.grafana.com/oss/deb stable main
      state: present
      update_cache: true
    register: _update_apt_cache
    until: _update_apt_cache is succeeded
    retries: 5
    delay: 2
    tags: grafana
  when:
  - ansible_pkg_mgr == "apt"
  - grafana_manage_repo
  environment: "{{ grafana_environment }}"
  tags: grafana

- name: Install Grafana
  package:
    name: "{{ grafana_package }}"
    state: "{{ (grafana_version == 'latest') | ternary('latest', 'present') }}"
  register: _install_packages
  until: _install_packages is succeeded
  retries: 5
  delay: 2
  notify: restart grafana
  tags: grafana
