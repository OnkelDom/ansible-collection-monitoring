---
- name: restart grafana
  become: true
  tags: grafana
  when:
  - _grafana_service_policy.manage | default(false) | bool
  - (_grafana_service_policy.state | default('stopped')) != 'stopped'
  ansible.builtin.service:
    name: grafana-server
    state: restarted
- name: set privileges on provisioned dashboards
  listen: provisioned dashboards changed
  become: true
  tags: grafana
  ansible.builtin.file:
    path: '{{ grafana_data_dir }}/dashboards'
    recurse: true
    owner: grafana
    group: grafana
    mode: '0640'
  when: []
- name: set privileges on provisioned dashboards directory
  listen: provisioned dashboards changed
  become: true
  tags: grafana
  ansible.builtin.file:
    path: '{{ grafana_data_dir }}/dashboards'
    state: directory
    recurse: false
    mode: '0755'
  when: []
