---
- name: Capture the requested service policy for deferred handlers
  ansible.builtin.set_fact:
    _ilo5_exporter_service_policy:
      manage: '{{ ilo5_exporter_manage_service | bool }}'
      state: '{{ ilo5_exporter_service_state }}'
      enabled: '{{ ilo5_exporter_service_enabled | bool }}'
- name: Validate the bundled binary architecture
  ansible.builtin.assert:
    that:
    - ansible_facts.architecture in ['x86_64', 'aarch64']
    fail_msg: Bundled verified exporters support x86_64 and aarch64 only.
- name: create system group
  ansible.builtin.group:
    name: prometheus
    system: true
    state: present
  become: true
  tags: ilo5_exporter
- name: create system user
  ansible.builtin.user:
    name: prometheus
    system: true
    shell: /sbin/nologin
    group: prometheus
    createhome: false
  become: true
  tags: ilo5_exporter
- name: check if is installed
  ansible.builtin.stat:
    path: /usr/local/bin/ilo5_exporter
  register: __ilo5_exporter_is_installed
  become: true
  tags: ilo5_exporter
- name: propagate binaries
  ansible.builtin.copy:
    src: 'ilo5_exporter_linux_{{ {''x86_64'': ''amd64'', ''aarch64'': ''arm64''}[ansible_facts.architecture] }}'
    dest: /usr/local/bin/ilo5_exporter
    mode: '0755'
    owner: root
    group: root
  notify: restart ilo5_exporter
  become: true
  tags: ilo5_exporter
- name: create systemd service unit
  ansible.builtin.template:
    src: ilo5_exporter.service.j2
    dest: /etc/systemd/system/ilo5_exporter.service
    owner: root
    group: root
    mode: '0644'
  notify: restart ilo5_exporter
  become: true
  tags: ilo5_exporter
- name: ensure service is started and enabled
  ansible.builtin.systemd:
    daemon_reload: true
    name: ilo5_exporter
    enabled: '{{ ilo5_exporter_service_enabled }}'
    state: '{{ ilo5_exporter_service_state }}'
  become: true
  tags: ilo5_exporter
  when:
  - ilo5_exporter_manage_service | bool
