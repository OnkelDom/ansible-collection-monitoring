---
- name: Capture the requested service policy for deferred handlers
  ansible.builtin.set_fact:
    _pushgateway_service_policy:
      manage: '{{ pushgateway_manage_service | bool }}'
      state: '{{ pushgateway_service_state }}'
      enabled: '{{ pushgateway_service_enabled | bool }}'
- name: create system group
  when: pushgateway_system_group != "root"
  become: true
  tags: pushgateway
  ansible.builtin.group:
    name: '{{ pushgateway_system_group }}'
    system: true
    state: present
- name: create system user
  when: pushgateway_system_user != "root"
  become: true
  tags: pushgateway
  ansible.builtin.user:
    name: '{{ pushgateway_system_user }}'
    system: true
    shell: /sbin/nologin
    group: '{{ pushgateway_system_group }}'
    createhome: false
- name: Create versioned release cache
  ansible.builtin.file:
    path: '{{ _pushgateway_download_dir }}/pushgateway-{{ pushgateway_version }}.linux-{{ go_arch }}'
    state: directory
    owner: root
    group: root
    mode: '0755'
- name: Download checksum-verified release on the target
  ansible.builtin.get_url:
    url: https://github.com/prometheus/pushgateway/releases/download/v{{ pushgateway_version }}/pushgateway-{{ pushgateway_version }}.linux-{{ go_arch }}.tar.gz
    dest: '{{ _pushgateway_download_dir }}/pushgateway-{{ pushgateway_version }}.linux-{{ go_arch }}.tar.gz'
    checksum: sha256:https://github.com/prometheus/pushgateway/releases/download/v{{ pushgateway_version }}/sha256sums.txt
    mode: '0644'
  environment: '{{ proxy_env }}'
  register: _release_download
  until: _release_download is succeeded
  retries: 3
  delay: 2
- name: Extract the selected release
  ansible.builtin.unarchive:
    src: '{{ _pushgateway_download_dir }}/pushgateway-{{ pushgateway_version }}.linux-{{ go_arch }}.tar.gz'
    dest: '{{ _pushgateway_download_dir }}/pushgateway-{{ pushgateway_version }}.linux-{{ go_arch }}'
    remote_src: true
    creates: '{{ _pushgateway_download_dir }}/pushgateway-{{ pushgateway_version }}.linux-{{ go_arch }}/pushgateway-{{ pushgateway_version }}.linux-{{ go_arch }}/pushgateway'
- name: Install the selected release binary
  ansible.builtin.copy:
    src: '{{ _pushgateway_download_dir }}/pushgateway-{{ pushgateway_version }}.linux-{{ go_arch }}/pushgateway-{{ pushgateway_version }}.linux-{{ go_arch }}/pushgateway'
    dest: '{{ pushgateway_binary_local_dir }}/pushgateway'
    remote_src: true
    owner: root
    group: root
    mode: '0755'
  notify: restart pushgateway
- name: copy the pushgateway systemd service file
  notify: restart pushgateway
  become: true
  tags: pushgateway
  ansible.builtin.template:
    src: pushgateway.service.j2
    dest: /etc/systemd/system/pushgateway.service
    owner: root
    group: root
    mode: '0644'
- block:
  - name: create persistence file dir
    become: true
    tags: pushgateway
    ansible.builtin.file:
      path: '{{ pushgateway_persistence_dir }}'
      state: directory
      owner: '{{ pushgateway_system_user }}'
      group: '{{ pushgateway_system_group }}'
      mode: '0755'
  when: pushgateway_persistence
- name: ensure service is started and enabled
  become: true
  tags: pushgateway
  when:
  - pushgateway_manage_service | bool
  ansible.builtin.systemd_service:
    daemon_reload: true
    name: pushgateway
    enabled: '{{ pushgateway_service_enabled }}'
    state: '{{ pushgateway_service_state }}'
