---
- name: restart pushgateway
  become: true
  tags: pushgateway
  when:
  - _pushgateway_service_policy.manage | default(false) | bool
  - (_pushgateway_service_policy.state | default('stopped')) != 'stopped'
  ansible.builtin.systemd_service:
    daemon_reload: true
    name: pushgateway
    state: restarted
- name: reload pushgateway
  become: true
  tags: pushgateway
  when:
  - _pushgateway_service_policy.manage | default(false) | bool
  - (_pushgateway_service_policy.state | default('stopped')) != 'stopped'
  ansible.builtin.systemd_service:
    name: pushgateway
    state: reloaded
