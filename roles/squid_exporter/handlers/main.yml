---
- name: restart squid_exporter
  tags: squid_exporter
  become: true
  when:
  - _squid_exporter_service_policy.manage | default(false) | bool
  - (_squid_exporter_service_policy.state | default('stopped')) != 'stopped'
  ansible.builtin.systemd_service:
    daemon_reload: true
    name: squid_exporter
    state: restarted
- name: reload squid_exporter
  tags: squid_exporter
  become: true
  when:
  - _squid_exporter_service_policy.manage | default(false) | bool
  - (_squid_exporter_service_policy.state | default('stopped')) != 'stopped'
  ansible.builtin.systemd_service:
    daemon_reload: true
    name: squid_exporter
    state: restarted
