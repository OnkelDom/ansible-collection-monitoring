---
- name: Capture the requested service policy for deferred handlers
  ansible.builtin.set_fact:
    _redis_exporter_service_policy:
      manage: '{{ redis_exporter_manage_service | bool }}'
      state: '{{ redis_exporter_service_state }}'
      enabled: '{{ redis_exporter_service_enabled | bool }}'
- name: create system group
  ansible.builtin.group:
    name: prometheus
    system: true
    state: present
  become: true
  tags: redis_exporter
- name: create system user
  ansible.builtin.user:
    name: prometheus
    system: true
    shell: /sbin/nologin
    group: prometheus
    createhome: false
  become: true
  tags: redis_exporter
- name: Create versioned release cache
  ansible.builtin.file:
    path: '{{ _redis_exporter_download_dir }}/redis_exporter-v{{ redis_exporter_version }}.linux-{{ go_arch }}'
    state: directory
    owner: root
    group: root
    mode: '0755'
- name: Download checksum-verified release on the target
  ansible.builtin.get_url:
    url: https://github.com/oliver006/redis_exporter/releases/download/v{{ redis_exporter_version }}/redis_exporter-v{{ redis_exporter_version }}.linux-{{ go_arch }}.tar.gz
    dest: '{{ _redis_exporter_download_dir }}/redis_exporter-v{{ redis_exporter_version }}.linux-{{ go_arch }}.tar.gz'
    checksum: sha256:https://github.com/oliver006/redis_exporter/releases/download/v{{ redis_exporter_version }}/sha256sums.txt
    mode: '0644'
  environment: '{{ proxy_env }}'
  register: _release_download
  until: _release_download is succeeded
  retries: 3
  delay: 2
- name: Extract the selected release
  ansible.builtin.unarchive:
    src: '{{ _redis_exporter_download_dir }}/redis_exporter-v{{ redis_exporter_version }}.linux-{{ go_arch }}.tar.gz'
    dest: '{{ _redis_exporter_download_dir }}/redis_exporter-v{{ redis_exporter_version }}.linux-{{ go_arch }}'
    remote_src: true
    creates: '{{ _redis_exporter_download_dir }}/redis_exporter-v{{ redis_exporter_version }}.linux-{{ go_arch }}/redis_exporter-v{{ redis_exporter_version }}.linux-{{ go_arch }}/redis_exporter'
- name: Install the selected release binary
  ansible.builtin.copy:
    src: '{{ _redis_exporter_download_dir }}/redis_exporter-v{{ redis_exporter_version }}.linux-{{ go_arch }}/redis_exporter-v{{ redis_exporter_version }}.linux-{{ go_arch }}/redis_exporter'
    dest: /usr/local/bin/redis_exporter
    remote_src: true
    owner: root
    group: root
    mode: '0755'
  notify: restart redis_exporter
- name: create systemd service unit
  ansible.builtin.template:
    src: redis_exporter.service.j2
    dest: /etc/systemd/system/redis_exporter.service
    owner: root
    group: root
    mode: '0644'
  notify: restart redis_exporter
  become: true
  tags: redis_exporter
- name: ensure service is started and enabled
  ansible.builtin.systemd:
    daemon_reload: true
    name: redis_exporter
    enabled: '{{ redis_exporter_service_enabled }}'
    state: '{{ redis_exporter_service_state }}'
  become: true
  tags: redis_exporter
  when:
  - redis_exporter_manage_service | bool
