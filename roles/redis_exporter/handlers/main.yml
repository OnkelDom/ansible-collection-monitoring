---
- name: restart redis_exporter
  ansible.builtin.systemd:
    daemon_reload: true
    name: redis_exporter
    state: restarted
  become: true
  tags: redis_exporter
  when:
  - _redis_exporter_service_policy.manage | default(false) | bool
  - (_redis_exporter_service_policy.state | default('stopped')) != 'stopped'
