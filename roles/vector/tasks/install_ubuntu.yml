---
- name: Install Vector using the official setup script
  ansible.builtin.shell: set -o pipefail && curl -L https://setup.vector.dev | bash
  args:
    executable: /bin/bash
  tags: vector
  changed_when: false
- name: Install vector
  tags: vector
  ansible.builtin.apt:
    name: vector
    state: present
    cache_valid_time: 600
