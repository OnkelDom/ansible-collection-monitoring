---
- name: Capture the requested service policy for deferred handlers
  ansible.builtin.set_fact:
    _vector_service_policy:
      manage: '{{ vector_manage_service | bool }}'
      state: '{{ vector_service_state }}'
      enabled: '{{ vector_service_enabled | bool }}'
- name: Create Vector package cache
  ansible.builtin.file:
    path: /var/cache/degitag/vector
    state: directory
    mode: '0755'
  when: vector_install | bool
- name: Download the pinned and checksum-verified Vector package
  ansible.builtin.get_url:
    url: https://github.com/vectordotdev/vector/releases/download/v{{ vector_version }}/{{ _vector_platform_package }}
    dest: /var/cache/degitag/vector/{{ _vector_platform_package }}
    checksum: sha256:https://github.com/vectordotdev/vector/releases/download/v{{ vector_version }}/vector-{{ vector_version }}-SHA256SUMS
    mode: '0644'
  when: vector_install | bool
- name: Install the verified Debian package without an automatic service start
  ansible.builtin.apt:
    deb: /var/cache/degitag/vector/{{ _vector_platform_package }}
    policy_rc_d: 101
  when:
  - vector_install | bool
  - ansible_facts.os_family == 'Debian'
- name: Install the verified RPM package
  ansible.builtin.dnf:
    name: /var/cache/degitag/vector/{{ _vector_platform_package }}
    disable_gpg_check: true
  when:
  - vector_install | bool
  - ansible_facts.os_family == 'RedHat'
- name: Create the Vector data directory
  ansible.builtin.file:
    path: '{{ vector_configure_data_dir }}'
    state: directory
    owner: vector
    group: vector
    mode: '0750'
- name: Remove default vector config
  when: vector_configure_rm_default | bool
  tags: vector
  ansible.builtin.file:
    path: /etc/vector/vector.toml
    state: absent
- name: Set vector config file path
  notify:
  - restart vector
  tags: vector
  ansible.builtin.template:
    src: vector.default.j2
    dest: /etc/default/vector
    mode: '0644'
- name: Provide configuration file
  notify:
  - reload vector
  tags: vector
  ansible.builtin.template:
    src: vector.yaml.j2
    dest: '{{ vector_configure_config_path }}'
    mode: '0644'
    validate: vector validate --no-environment --skip-healthchecks %s
- name: Start and enable service
  tags: vector
  when:
  - vector_manage_service | bool
  ansible.builtin.systemd_service:
    name: vector
    enabled: '{{ vector_service_enabled }}'
    state: '{{ vector_service_state }}'
