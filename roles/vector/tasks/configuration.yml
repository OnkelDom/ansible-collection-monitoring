---
- name: Capture the requested service policy for deferred handlers
  ansible.builtin.set_fact:
    _vector_service_policy:
      manage: '{{ vector_manage_service | bool }}'
      state: '{{ vector_service_state }}'
      enabled: '{{ vector_service_enabled | bool }}'
- name: Include vars with any tags
  block:
  - name: Include os-specific variables
    ansible.builtin.include_vars: '{{ ansible_facts.distribution | lower }}.yml'
  tags:
  - always
- name: Install Vector using the official setup script
  ansible.builtin.shell: set -o pipefail && curl -L https://setup.vector.dev | bash
  args:
    executable: /bin/bash
  tags: vector
  changed_when: '''already installed'' not in (vector_install_script.stdout | default(''''))'
  register: vector_install_script
- name: Install vector
  ansible.builtin.package:
    name: vector
    state: latest
  tags: vector
- name: Remove default vector config
  when: vector_configure_rm_default | bool
  tags: vector
  ansible.builtin.file:
    path: /etc/vector/vector.toml
    state: absent
- name: Set vector config file path
  notify:
  - restart vector
  tags: vector
  ansible.builtin.template:
    src: vector.default.j2
    dest: /etc/default/vector
    mode: '0644'
- name: Provide configuration file
  notify:
  - reload vector
  tags: vector
  ansible.builtin.template:
    src: vector.yaml.j2
    dest: '{{ vector_configure_config_path }}'
    mode: '0644'
- name: Start and enable service
  tags: vector
  when:
  - vector_manage_service | bool
  ansible.builtin.systemd_service:
    name: vector
    enabled: '{{ vector_service_enabled }}'
    state: '{{ vector_service_state }}'
