---
- name: restart vector
  tags: vector
  when:
  - _vector_service_policy.manage | default(false) | bool
  - (_vector_service_policy.state | default('stopped')) != 'stopped'
  ansible.builtin.systemd_service:
    name: vector
    state: reloaded
- name: reload vector
  tags: vector
  when:
  - _vector_service_policy.manage | default(false) | bool
  - (_vector_service_policy.state | default('stopped')) != 'stopped'
  ansible.builtin.systemd_service:
    name: vector
    state: restarted
