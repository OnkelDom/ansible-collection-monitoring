---
- name: restart alertmanager
  ansible.builtin.systemd:
    daemon_reload: true
    name: alertmanager
    state: restarted
  become: true
  tags: alertmanager
  when:
  - _alertmanager_service_policy.manage | default(false) | bool
  - (_alertmanager_service_policy.state | default('stopped')) != 'stopped'
- name: reload alertmanager
  ansible.builtin.systemd:
    name: alertmanager
    state: reloaded
  become: true
  tags: alertmanager
  when:
  - _alertmanager_service_policy.manage | default(false) | bool
  - (_alertmanager_service_policy.state | default('stopped')) != 'stopped'
