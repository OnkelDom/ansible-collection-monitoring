---
- name: restart unbound_exporter
  ansible.builtin.systemd:
    daemon_reload: true
    name: unbound_exporter
    state: restarted
  become: true
  tags: unbound_exporter
  when:
  - _unbound_exporter_service_policy.manage | default(false) | bool
  - (_unbound_exporter_service_policy.state | default('stopped')) != 'stopped'
