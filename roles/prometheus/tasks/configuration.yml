---
- name: Capture the requested service policy for deferred handlers
  ansible.builtin.set_fact:
    _prometheus_service_policy:
      manage: '{{ prometheus_manage_service | bool }}'
      state: '{{ prometheus_service_state }}'
      enabled: '{{ prometheus_service_enabled | bool }}'
  tags:
  - always
- name: create system group
  ansible.builtin.group:
    name: prometheus
    system: true
    state: present
  become: true
  tags: prometheus
- name: create system user
  ansible.builtin.user:
    name: prometheus
    system: true
    shell: /sbin/nologin
    group: prometheus
    createhome: false
  become: true
  tags: prometheus
- name: create configuration and data directories
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    owner: prometheus
    group: prometheus
    mode: '0755'
  with_items:
  - /etc/prometheus
  - /etc/prometheus/rules
  - /etc/prometheus/file_sd
  - '{{ prometheus_data_dir }}'
  become: true
  tags: prometheus
- name: check if is installed
  ansible.builtin.stat:
    path: /usr/local/bin/prometheus
  register: __prometheus_is_installed
  become: true
  tags: prometheus
- name: gather currently installed version (if any)
  ansible.builtin.command: /usr/local/bin/prometheus --version
  changed_when: false
  register: __prometheus_current_version_output
  when: __prometheus_is_installed.stat.exists
  become: true
  tags: prometheus
- name: Download the verified prometheus archive on the target
  ansible.builtin.get_url:
    url: https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_version }}/prometheus-{{ prometheus_version }}.linux-{{ go_arch }}.tar.gz
    dest: /tmp/prometheus-{{ prometheus_version }}.linux-{{ go_arch }}.tar.gz
    mode: '0644'
    checksum: sha256:https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_version }}/sha256sums.txt
  register: _download_archive
  until: _download_archive is succeeded
  retries: 5
  delay: 2
  check_mode: false
  become: true
  tags: prometheus
  when: (not __prometheus_is_installed.stat.exists) or (__prometheus_current_version_output.stdout_lines[0].split(" ")[2] != prometheus_version)
- name: unpack binaries
  ansible.builtin.unarchive:
    src: /tmp/prometheus-{{ prometheus_version }}.linux-{{ go_arch }}.tar.gz
    dest: /tmp
    creates: /tmp/prometheus-{{ prometheus_version }}.linux-{{ go_arch }}/prometheus
    remote_src: true
  check_mode: false
  become: true
  tags: prometheus
  when: (not __prometheus_is_installed.stat.exists) or (__prometheus_current_version_output.stdout_lines[0].split(" ")[2] != prometheus_version)
- name: propagate binaries
  ansible.builtin.copy:
    src: /tmp/prometheus-{{ prometheus_version }}.linux-{{ go_arch }}/{{ item }}
    dest: /usr/local/bin/{{ item }}
    mode: '0755'
    owner: root
    group: root
    remote_src: true
  with_items:
  - prometheus
  - promtool
  notify: restart prometheus
  become: true
  tags: prometheus
  when: (not __prometheus_is_installed.stat.exists) or (__prometheus_current_version_output.stdout_lines[0].split(" ")[2] != prometheus_version)
- name: propagate console templates
  ansible.builtin.copy:
    src: /tmp/prometheus-{{ prometheus_version }}.linux-{{ go_arch }}/{{ item }}/
    dest: /etc/prometheus/{{ item }}/
    mode: '0644'
    owner: prometheus
    group: prometheus
    remote_src: true
  with_items:
  - console_libraries
  - consoles
  notify: restart prometheus
  become: true
  tags: prometheus
  when:
  - prometheus_version is version('3.0.0', '<')
  - (not __prometheus_is_installed.stat.exists) or (__prometheus_current_version_output.stdout_lines[0].split(" ")[2] != prometheus_version)
- name: register alertrules
  ansible.builtin.find:
    paths: /etc/prometheus/rules
    file_type: file
    recurse: false
  register: alertrule_files
  become: true
  tags:
  - prometheus
  - prometheus_alertrules
- name: remove unmanaged alertrules
  ansible.builtin.file:
    path: /etc/prometheus/rules/{{ item }}
    state: absent
  with_items: '{{ alertrule_files.files | map(attribute=''path'') | map(''basename'') | list }}'
  when: item not in prometheus_alert_rules_files
  notify: reload prometheus
  become: true
  tags:
  - prometheus
  - prometheus_alertrules
- name: copy alert rules files
  ansible.builtin.copy:
    src: '{{ prometheus_alert_rules_src_dir }}/{{ item }}'
    dest: /etc/prometheus/rules/{{ item }}
    mode: '0644'
    owner: prometheus
    group: prometheus
    validate: /usr/local/bin/promtool check rules %s
  with_items: '{{ prometheus_alert_rules_files }}'
  when: prometheus_platform_annotation_overrides | length == 0
  notify: reload prometheus
  become: true
  tags:
  - prometheus
  - prometheus_alertrules
- name: Apply platform-specific alert annotations
  ansible.builtin.copy:
    content: '{{ lookup(''ansible.builtin.file'', prometheus_alert_rules_src_dir ~ ''/'' ~ item) | from_yaml | degitag.monitoring.monitoring_platform_annotations(prometheus_platform_annotation_overrides) | to_nice_yaml(indent=2, sort_keys=False) }}'
    dest: /etc/prometheus/rules/{{ item }}
    mode: '0644'
    owner: prometheus
    group: prometheus
    validate: /usr/local/bin/promtool check rules %s
  loop: '{{ prometheus_alert_rules_files }}'
  when: prometheus_platform_annotation_overrides | length > 0
  notify: reload prometheus
  become: true
  tags:
  - prometheus
  - prometheus_alertrules
- name: register static targets
  ansible.builtin.find:
    paths: /etc/prometheus/file_sd
    file_type: file
    recurse: false
  register: static_target_files
  become: true
  tags:
  - prometheus
  - prometheus_config
  - prometheus_file_sd
- name: remove unmanaged static targets
  ansible.builtin.file:
    path: /etc/prometheus/file_sd/{{ item }}
    state: absent
  with_items: '{{ static_target_files.files | map(attribute=''path'') | map(''basename'') | list }}'
  when: item not in prometheus_static_targets_files
  notify: reload prometheus
  become: true
  tags:
  - prometheus
  - prometheus_config
  - prometheus_file_sd
- name: copy prometheus custom static targets
  ansible.builtin.copy:
    src: '{{ prometheus_static_targets_src_dir }}/{{ item }}'
    dest: /etc/prometheus/file_sd/
    force: true
    owner: prometheus
    group: prometheus
    mode: '0640'
  notify: reload prometheus
  with_items: '{{ prometheus_static_targets_files }}'
  become: true
  tags:
  - prometheus
  - prometheus_config
  - prometheus_file_sd
- name: Create bundled LPM rules directory
  ansible.builtin.file:
    path: /etc/prometheus/lpm
    state: directory
    owner: prometheus
    group: prometheus
    mode: '0755'
  become: true
  tags:
  - prometheus
  - prometheus_config
  - prometheus_config_only
  - prometheus_alertrules
- name: Install neutral LPM host rules
  ansible.builtin.copy:
    content: '{{ lookup(''ansible.builtin.file'', role_path ~ ''/files/lpm/host.rules'') | degitag.monitoring.monitoring_lpm_rules(prometheus_lpm_default_criticality, prometheus_lpm_dashboard_url, prometheus_lpm_runbook_url) | degitag.monitoring.monitoring_platform_annotations(lookup(''ansible.builtin.file'', role_path ~ ''/files/lpm/platform-annotations.yml'')) | degitag.monitoring.monitoring_platform_annotations(prometheus_platform_annotation_overrides) }}'
    dest: /etc/prometheus/lpm/host.rules
    owner: prometheus
    group: prometheus
    mode: '0644'
    validate: /usr/local/bin/promtool check rules %s
  when: prometheus_lpm_enabled | bool
  become: true
  notify: reload prometheus
  tags:
  - prometheus
  - prometheus_config
  - prometheus_config_only
  - prometheus_alertrules
- name: Remove disabled bundled LPM host rules
  ansible.builtin.file:
    path: /etc/prometheus/lpm/host.rules
    state: absent
  when: not prometheus_lpm_enabled | bool
  become: true
  notify: reload prometheus
  tags:
  - prometheus
  - prometheus_config
  - prometheus_config_only
  - prometheus_alertrules
- name: Reconcile native PVE monitoring rules
  ansible.builtin.import_tasks: proxmox_rules.yml
  tags: [prometheus, prometheus_config, prometheus_config_only, prometheus_alertrules]
- name: generate config file
  ansible.builtin.copy:
    content: '{{ prometheus_config | combine({''rule_files'': ((prometheus_config.rule_files | default([])) + ([''/etc/prometheus/lpm/*.rules''] if prometheus_lpm_enabled else [])) | unique | list}) | to_nice_yaml(indent=2, sort_keys=False) }}'
    dest: /etc/prometheus/config.yml
    owner: prometheus
    group: prometheus
    mode: '0644'
    validate: /usr/local/bin/promtool check config %s
  notify: reload prometheus
  become: true
  tags:
  - prometheus
  - prometheus_config
  - prometheus_config_only
- name: generate webconfig file
  ansible.builtin.copy:
    content: '{{ prometheus_webconfig | to_nice_yaml(indent=2, sort_keys=False) }}

      '
    dest: /etc/prometheus/web-config.yml
    owner: prometheus
    group: prometheus
    mode: '0644'
  notify: restart prometheus
  become: true
  when: prometheus_webconfig | length > 0
  tags:
  - prometheus
  - prometheus_config
- name: create systemd service unit
  ansible.builtin.template:
    src: prometheus.service.j2
    dest: /etc/systemd/system/prometheus.service
    owner: root
    group: root
    mode: '0644'
  notify: restart prometheus
  become: true
  tags: prometheus
- name: ensure service is started and enabled
  ansible.builtin.systemd:
    daemon_reload: true
    name: prometheus
    enabled: '{{ prometheus_service_enabled }}'
    state: '{{ prometheus_service_state }}'
  become: true
  tags: prometheus
  when:
  - prometheus_manage_service | bool
