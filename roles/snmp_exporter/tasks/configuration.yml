---
- name: Capture the requested service policy for deferred handlers
  ansible.builtin.set_fact:
    _snmp_exporter_service_policy:
      manage: '{{ snmp_exporter_manage_service | bool }}'
      state: '{{ snmp_exporter_service_state }}'
      enabled: '{{ snmp_exporter_service_enabled | bool }}'
- name: create system group
  when: snmp_exporter_system_group != "root"
  become: true
  tags: snmp_exporter
  ansible.builtin.group:
    name: '{{ snmp_exporter_system_group }}'
    system: true
    state: present
- name: create system user
  when: snmp_exporter_system_user != "root"
  become: true
  tags: snmp_exporter
  ansible.builtin.user:
    name: '{{ snmp_exporter_system_user }}'
    system: true
    shell: /sbin/nologin
    group: '{{ snmp_exporter_system_group }}'
    createhome: false
- name: create data directory
  become: true
  tags: snmp_exporter
  ansible.builtin.file:
    path: '{{ snmp_exporter_config_dir }}'
    state: directory
    owner: '{{ snmp_exporter_system_user }}'
    group: '{{ snmp_exporter_system_group }}'
    mode: '0755'
- name: Create versioned release cache
  ansible.builtin.file:
    path: '{{ _snmp_exporter_download_dir }}/snmp_exporter-{{ snmp_exporter_version }}.linux-{{ go_arch }}'
    state: directory
    owner: root
    group: root
    mode: '0755'
- name: Download checksum-verified release on the target
  ansible.builtin.get_url:
    url: https://github.com/prometheus/snmp_exporter/releases/download/v{{ snmp_exporter_version }}/snmp_exporter-{{ snmp_exporter_version }}.linux-{{ go_arch }}.tar.gz
    dest: '{{ _snmp_exporter_download_dir }}/snmp_exporter-{{ snmp_exporter_version }}.linux-{{ go_arch }}.tar.gz'
    checksum: sha256:https://github.com/prometheus/snmp_exporter/releases/download/v{{ snmp_exporter_version }}/sha256sums.txt
    mode: '0644'
  environment: '{{ proxy_env }}'
  register: _release_download
  until: _release_download is succeeded
  retries: 3
  delay: 2
- name: Extract the selected release
  ansible.builtin.unarchive:
    src: '{{ _snmp_exporter_download_dir }}/snmp_exporter-{{ snmp_exporter_version }}.linux-{{ go_arch }}.tar.gz'
    dest: '{{ _snmp_exporter_download_dir }}/snmp_exporter-{{ snmp_exporter_version }}.linux-{{ go_arch }}'
    remote_src: true
    creates: '{{ _snmp_exporter_download_dir }}/snmp_exporter-{{ snmp_exporter_version }}.linux-{{ go_arch }}/snmp_exporter-{{ snmp_exporter_version }}.linux-{{ go_arch }}/snmp_exporter'
- name: Install the selected release binary
  ansible.builtin.copy:
    src: '{{ _snmp_exporter_download_dir }}/snmp_exporter-{{ snmp_exporter_version }}.linux-{{ go_arch }}/snmp_exporter-{{ snmp_exporter_version }}.linux-{{ go_arch }}/snmp_exporter'
    dest: '{{ snmp_exporter_binary_local_dir }}/snmp_exporter'
    remote_src: true
    owner: root
    group: root
    mode: '0755'
  notify: restart snmp_exporter
- name: Install and validate the release SNMP configuration
  ansible.builtin.copy:
    src: '{{ _snmp_exporter_download_dir }}/snmp_exporter-{{ snmp_exporter_version }}.linux-{{ go_arch }}/snmp_exporter-{{ snmp_exporter_version }}.linux-{{ go_arch }}/snmp.yml'
    dest: '{{ snmp_exporter_config_dir }}/config.yml'
    remote_src: true
    owner: root
    group: root
    mode: '0644'
    validate: '{{ snmp_exporter_binary_local_dir }}/snmp_exporter --config.file=%s --dry-run'
  notify: restart snmp_exporter
  when: snmp_exporter_config_file == ""
- name: copy configuration file
  notify: reload snmp_exporter
  when: snmp_exporter_config_file != ""
  become: true
  tags:
  - snmp_exporter
  - snmp_exporter_config
  ansible.builtin.copy:
    src: '{{ snmp_exporter_config_file }}'
    dest: '{{ snmp_exporter_config_dir }}/config.yml'
    owner: root
    group: root
    mode: '0644'
    validate: '{{ snmp_exporter_binary_local_dir }}/snmp_exporter --config.file="%s" --dry-run'
- name: copy systemd service unit
  notify: restart snmp_exporter
  become: true
  tags: snmp_exporter
  ansible.builtin.template:
    src: snmp_exporter.service.j2
    dest: /etc/systemd/system/snmp_exporter.service
    owner: root
    group: root
    mode: '0644'
- name: ensure service is started and enabled
  become: true
  tags: snmp_exporter
  when:
  - snmp_exporter_manage_service | bool
  ansible.builtin.systemd_service:
    daemon_reload: true
    name: snmp_exporter
    state: '{{ snmp_exporter_service_state }}'
    enabled: '{{ snmp_exporter_service_enabled }}'
