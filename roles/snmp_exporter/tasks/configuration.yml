---
- name: Capture the requested service policy for deferred handlers
  ansible.builtin.set_fact:
    _snmp_exporter_service_policy:
      manage: '{{ snmp_exporter_manage_service | bool }}'
      state: '{{ snmp_exporter_service_state }}'
      enabled: '{{ snmp_exporter_service_enabled | bool }}'
- name: create system group
  when: snmp_exporter_system_group != "root"
  become: true
  tags: snmp_exporter
  ansible.builtin.group:
    name: '{{ snmp_exporter_system_group }}'
    system: true
    state: present
- name: create system user
  when: snmp_exporter_system_user != "root"
  become: true
  tags: snmp_exporter
  ansible.builtin.user:
    name: '{{ snmp_exporter_system_user }}'
    system: true
    shell: /sbin/nologin
    group: '{{ snmp_exporter_system_group }}'
    createhome: false
- name: create data directory
  become: true
  tags: snmp_exporter
  ansible.builtin.file:
    path: '{{ snmp_exporter_config_dir }}'
    state: directory
    owner: '{{ snmp_exporter_system_user }}'
    group: '{{ snmp_exporter_system_group }}'
    mode: '0755'
- name: check if snmp_exporter is installed
  register: __snmp_exporter_is_installed
  become: true
  tags: snmp_exporter
  ansible.builtin.stat:
    path: '{{ snmp_exporter_binary_local_dir }}/snmp_exporter'
- name: download binary to local folder
  environment: '{{ proxy_env }}'
  register: _download_binary
  until: _download_binary is success
  retries: 5
  delay: 2
  delegate_to: localhost
  check_mode: false
  become: true
  tags: snmp_exporter
  when: (not __snmp_exporter_is_installed.stat.exists)
  ansible.builtin.get_url:
    url: https://github.com/prometheus/snmp_exporter/releases/download/v{{ snmp_exporter_version }}/snmp_exporter-{{ snmp_exporter_version }}.linux-{{ go_arch_map[ansible_facts.architecture] | default(ansible_facts.architecture) }}.tar.gz
    dest: /tmp
    mode: '0644'
- name: unpack binary
  delegate_to: localhost
  check_mode: false
  become: true
  tags: snmp_exporter
  when: (not __snmp_exporter_is_installed.stat.exists)
  ansible.builtin.unarchive:
    src: /tmp/snmp_exporter-{{ snmp_exporter_version }}.linux-{{ go_arch_map[ansible_facts.architecture] | default(ansible_facts.architecture) }}.tar.gz
    dest: /tmp
    creates: /tmp/snmp_exporter-{{ snmp_exporter_version }}.linux-{{ go_arch_map[ansible_facts.architecture] | default(ansible_facts.architecture) }}/snmp_exporter
- name: propagate binaries
  notify: restart snmp exporter
  become: true
  tags: snmp_exporter
  when: (not __snmp_exporter_is_installed.stat.exists)
  ansible.builtin.copy:
    src: /tmp/snmp_exporter-{{ snmp_exporter_version }}.linux-{{ go_arch_map[ansible_facts.architecture] | default(ansible_facts.architecture) }}/snmp_exporter
    dest: '{{ snmp_exporter_binary_local_dir }}/snmp_exporter'
    mode: '0755'
- name: download configuration file from github repository
  environment: '{{ proxy_env }}'
  register: _download_config
  until: _download_config is success
  retries: 5
  delay: 2
  notify:
  - reload snmp exporter
  when: snmp_exporter_config_file == ""
  become: true
  tags: snmp_exporter
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/prometheus/snmp_exporter/v{{ snmp_exporter_version }}/snmp.yml
    dest: '{{ snmp_exporter_config_dir }}/config.yml'
    validate_certs: true
    owner: root
    group: root
    mode: '0644'
- name: copy configuration file
  notify: reload snmp exporter
  when: snmp_exporter_config_file != ""
  become: true
  tags:
  - snmp_exporter
  - snmp_exporter_config
  ansible.builtin.copy:
    src: '{{ snmp_exporter_config_file }}'
    dest: '{{ snmp_exporter_config_dir }}/{{ snmp_exporter_config_file }}'
    owner: root
    group: root
    mode: '0644'
    validate: '{{ snmp_exporter_binary_local_dir }}/snmp_exporter --config.file="%s" --dry-run'
- name: copy systemd service unit
  notify: restart snmp exporter
  become: true
  tags: snmp_exporter
  ansible.builtin.template:
    src: snmp_exporter.service.j2
    dest: /etc/systemd/system/snmp_exporter.service
    owner: root
    group: root
    mode: '0644'
- name: ensure service is started and enabled
  become: true
  tags: snmp_exporter
  when:
  - snmp_exporter_manage_service | bool
  ansible.builtin.systemd_service:
    daemon_reload: true
    name: snmp_exporter
    state: '{{ snmp_exporter_service_state }}'
    enabled: '{{ snmp_exporter_service_enabled }}'
