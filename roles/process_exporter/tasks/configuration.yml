---
- name: Reject the upstream release with a broken listener
  ansible.builtin.assert:
    that: process_exporter_version != '0.8.0'
    fail_msg: Process Exporter 0.8.0 cannot start its HTTP listener; use 0.7.5 or 0.8.1 and qualify the selected version.
- name: Capture the requested service policy for deferred handlers
  ansible.builtin.set_fact:
    _process_exporter_service_policy:
      manage: '{{ process_exporter_manage_service | bool }}'
      state: '{{ process_exporter_service_state }}'
      enabled: '{{ process_exporter_service_enabled | bool }}'
- name: create system group
  when: process_exporter_system_group != "root"
  become: true
  tags: process_exporter
  ansible.builtin.group:
    name: '{{ process_exporter_system_group }}'
    system: true
    state: present
- name: create system user
  when: process_exporter_system_user != "root"
  become: true
  tags: process_exporter
  ansible.builtin.user:
    name: '{{ process_exporter_system_user }}'
    system: true
    shell: /sbin/nologin
    group: '{{ process_exporter_system_group }}'
    createhome: false
- name: create data directory
  become: true
  tags: process_exporter
  ansible.builtin.file:
    path: '{{ process_exporter_config_dir }}'
    state: directory
    owner: '{{ process_exporter_system_user }}'
    group: '{{ process_exporter_system_group }}'
    mode: '0755'
- name: Create versioned release cache
  ansible.builtin.file:
    path: '{{ _process_exporter_download_dir }}/process-exporter-{{ process_exporter_version }}.linux-{{ go_arch }}'
    state: directory
    owner: root
    group: root
    mode: '0755'
- name: Download checksum-verified release on the target
  ansible.builtin.get_url:
    url: https://github.com/ncabatoff/process-exporter/releases/download/v{{ process_exporter_version }}/process-exporter-{{ process_exporter_version }}.linux-{{ go_arch }}.tar.gz
    dest: '{{ _process_exporter_download_dir }}/process-exporter-{{ process_exporter_version }}.linux-{{ go_arch }}.tar.gz'
    checksum: sha256:https://github.com/ncabatoff/process-exporter/releases/download/v{{ process_exporter_version }}/checksums.txt
    mode: '0644'
  environment: '{{ proxy_env }}'
  register: _release_download
  until: _release_download is succeeded
  retries: 3
  delay: 2
- name: Extract the selected release
  ansible.builtin.unarchive:
    src: '{{ _process_exporter_download_dir }}/process-exporter-{{ process_exporter_version }}.linux-{{ go_arch }}.tar.gz'
    dest: '{{ _process_exporter_download_dir }}/process-exporter-{{ process_exporter_version }}.linux-{{ go_arch }}'
    remote_src: true
    creates: '{{ _process_exporter_download_dir }}/process-exporter-{{ process_exporter_version }}.linux-{{ go_arch }}/process-exporter-{{ process_exporter_version }}.linux-{{ go_arch }}/process-exporter'
- name: Install the selected release binary
  ansible.builtin.copy:
    src: '{{ _process_exporter_download_dir }}/process-exporter-{{ process_exporter_version }}.linux-{{ go_arch }}/process-exporter-{{ process_exporter_version }}.linux-{{ go_arch }}/process-exporter'
    dest: '{{ process_exporter_binary_install_dir }}/process_exporter'
    remote_src: true
    owner: root
    group: root
    mode: '0755'
  notify: restart process_exporter
- name: create/update configuration file
  when: process_exporter_names != []
  notify: reload process_exporter
  become: true
  tags: process_exporter
  ansible.builtin.copy:
    dest: '{{ process_exporter_config_dir }}/config.yml'
    content: 'process_names:

      {{ process_exporter_names }}

      '
    backup: false
    owner: '{{ process_exporter_system_user }}'
    group: '{{ process_exporter_system_group }}'
    mode: '0644'
- name: copy consul-agent service json
  when: process_exporter_create_consul_agent_service
  notify: reload consul
  become: true
  tags: process_exporter
  ansible.builtin.template:
    src: consul_agent_service.json.j2
    dest: /etc/consul/process_exporter.json
    owner: consul
    group: consul
    mode: '0644'
- name: copy systemd service file
  notify: restart process_exporter
  become: true
  tags: process_exporter
  ansible.builtin.template:
    src: process_exporter.service.j2
    dest: /etc/systemd/system/process_exporter.service
    owner: root
    group: root
    mode: '0644'
- name: ensure process_exporter is enabled on boot
  become: true
  tags: process_exporter
  when:
  - process_exporter_manage_service | bool
  ansible.builtin.systemd_service:
    daemon_reload: true
    name: process_exporter
    enabled: '{{ process_exporter_service_enabled }}'
    state: '{{ process_exporter_service_state }}'
