---
- name: Capture the requested service policy for deferred handlers
  ansible.builtin.set_fact:
    _victoriametrics_service_policy:
      manage: '{{ victoriametrics_manage_service | bool }}'
      state: '{{ victoriametrics_service_state }}'
      enabled: '{{ victoriametrics_service_enabled | bool }}'
- name: create system group
  when: victoriametrics_system_group != "root"
  become: true
  tags: victoriametrics
  ansible.builtin.group:
    name: '{{ victoriametrics_system_group }}'
    system: true
    state: present
- name: create system user
  when: victoriametrics_system_user != "root"
  become: true
  tags: victoriametrics
  ansible.builtin.user:
    name: '{{ victoriametrics_system_user }}'
    system: true
    shell: /sbin/nologin
    group: '{{ victoriametrics_system_group }}'
    createhome: false
- name: create data directory
  become: true
  tags: victoriametrics
  ansible.builtin.file:
    path: '{{ victoriametrics_data_dir }}'
    state: directory
    owner: '{{ victoriametrics_system_user }}'
    group: '{{ victoriametrics_system_group }}'
    mode: '0755'
- name: Create versioned release cache
  ansible.builtin.file:
    path: '{{ _victoriametrics_download_dir }}/victoria-metrics-{{ go_arch }}-v{{ victoriametrics_version }}'
    state: directory
    owner: root
    group: root
    mode: '0755'
- name: Read the architecture-specific upstream checksum manifest
  ansible.builtin.uri:
    url: https://github.com/VictoriaMetrics/VictoriaMetrics/releases/download/v{{ victoriametrics_version }}/victoria-metrics-{{ go_arch }}-v{{ victoriametrics_version }}_checksums.txt
    return_content: true
  register: _victoriametrics_release_manifest
  environment: '{{ proxy_env }}'
- name: Select the current or historical archive checksum name
  ansible.builtin.set_fact:
    _victoriametrics_release_checksums: '{{ _victoriametrics_release_manifest.content | regex_findall(''(?m)^([a-fA-F0-9]{64})\s+\*?victoria-metrics-(?:'' + go_arch + ''-)?v'' + (victoriametrics_version | regex_escape) + ''\.tar\.gz$'') }}'
- name: Require one unambiguous archive checksum
  ansible.builtin.assert:
    that:
    - _victoriametrics_release_checksums | length == 1
    fail_msg: The upstream manifest must identify exactly one matching release archive.
- name: Download checksum-verified release on the target
  ansible.builtin.get_url:
    url: https://github.com/VictoriaMetrics/VictoriaMetrics/releases/download/v{{ victoriametrics_version }}/victoria-metrics-{{ go_arch }}-v{{ victoriametrics_version }}.tar.gz
    dest: '{{ _victoriametrics_download_dir }}/victoria-metrics-{{ go_arch }}-v{{ victoriametrics_version }}.tar.gz'
    checksum: sha256:{{ _victoriametrics_release_checksums[0] }}
    mode: '0644'
  environment: '{{ proxy_env }}'
  register: _release_download
  until: _release_download is succeeded
  retries: 3
  delay: 2
- name: Extract the selected release
  ansible.builtin.unarchive:
    src: '{{ _victoriametrics_download_dir }}/victoria-metrics-{{ go_arch }}-v{{ victoriametrics_version }}.tar.gz'
    dest: '{{ _victoriametrics_download_dir }}/victoria-metrics-{{ go_arch }}-v{{ victoriametrics_version }}'
    remote_src: true
    creates: '{{ _victoriametrics_download_dir }}/victoria-metrics-{{ go_arch }}-v{{ victoriametrics_version }}/victoria-metrics-prod'
- name: Install the selected release binary
  ansible.builtin.copy:
    src: '{{ _victoriametrics_download_dir }}/victoria-metrics-{{ go_arch }}-v{{ victoriametrics_version }}/victoria-metrics-prod'
    dest: '{{ victoriametrics_binary_install_dir }}/victoriametrics'
    remote_src: true
    owner: root
    group: root
    mode: '0755'
  notify: restart victoriametrics
- block:
  - name: create config directory
    become: true
    tags: victoriametrics
    ansible.builtin.file:
      path: '{{ victoriametrics_config_dir }}'
      state: directory
      owner: '{{ victoriametrics_system_user }}'
      group: '{{ victoriametrics_system_group }}'
      mode: '0755'
  - name: create config file
    notify: restart victoriametrics
    become: true
    tags: victoriametrics
    ansible.builtin.template:
      src: victoriametrics.config.json.j2
      dest: '{{ victoriametrics_config_dir }}/config.yml'
      owner: '{{ victoriametrics_system_user }}'
      group: '{{ victoriametrics_system_group }}'
      mode: '0644'
  when: victoriametrics_prometheus_config | length > 0
- name: create systemd service unit
  notify: restart victoriametrics
  become: true
  tags: victoriametrics
  ansible.builtin.template:
    src: victoriametrics.service.j2
    dest: /etc/systemd/system/victoriametrics.service
    owner: root
    group: root
    mode: '0644'
- name: start and enable victoriametrics
  become: true
  tags: victoriametrics
  when:
  - victoriametrics_manage_service | bool
  ansible.builtin.systemd_service:
    daemon_reload: true
    name: victoriametrics
    enabled: '{{ victoriametrics_service_enabled }}'
    state: '{{ victoriametrics_service_state }}'
