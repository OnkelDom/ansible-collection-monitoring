---
- name: restart blackbox_exporter
  ansible.builtin.systemd:
    daemon_reload: true
    name: blackbox_exporter
    state: restarted
  become: true
  tags: blackbox_exporter
  when:
  - _blackbox_exporter_service_policy.manage | default(false) | bool
  - (_blackbox_exporter_service_policy.state | default('stopped')) != 'stopped'
- name: reload blackbox_exporter
  ansible.builtin.systemd:
    name: blackbox_exporter
    state: reloaded
  become: true
  tags: blackbox_exporter
  when:
  - _blackbox_exporter_service_policy.manage | default(false) | bool
  - (_blackbox_exporter_service_policy.state | default('stopped')) != 'stopped'
