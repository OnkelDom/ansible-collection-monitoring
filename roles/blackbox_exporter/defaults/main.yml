---
proxy_env: {}
blackbox_exporter_version: 0.25.0
blackbox_exporter_log_level: warn
blackbox_exporter_webconfig: {}
blackbox_exporter_config_flags_extra: {}
blackbox_exporter_config:
  modules:
    http_2xx:
      prober: http
      timeout: 10s
      http:
        preferred_ip_protocol: ip4
    tcp_connect:
      prober: tcp
      timeout: 5s
blackbox_exporter_manage_service: true
blackbox_exporter_service_enabled: true
blackbox_exporter_service_state: started
