---
- name: Capture the requested service policy for deferred handlers
  ansible.builtin.set_fact:
    _consul_exporter_service_policy:
      manage: '{{ consul_exporter_manage_service | bool }}'
      state: '{{ consul_exporter_service_state }}'
      enabled: '{{ consul_exporter_service_enabled | bool }}'
- name: create system group
  when: consul_exporter_system_group != "root"
  become: true
  tags: consul_exporter
  ansible.builtin.group:
    name: '{{ consul_exporter_system_group }}'
    system: true
    state: present
- name: create system user
  when: consul_exporter_system_user != "root"
  become: true
  tags: consul_exporter
  ansible.builtin.user:
    name: '{{ consul_exporter_system_user }}'
    system: true
    shell: /sbin/nologin
    group: '{{ consul_exporter_system_group }}'
    home: /
    createhome: false
- name: Create versioned release cache
  ansible.builtin.file:
    path: '{{ _consul_exporter_download_dir }}/consul_exporter-{{ consul_exporter_version }}.linux-{{ go_arch }}'
    state: directory
    owner: root
    group: root
    mode: '0755'
- name: Download checksum-verified release on the target
  ansible.builtin.get_url:
    url: https://github.com/prometheus/consul_exporter/releases/download/v{{ consul_exporter_version }}/consul_exporter-{{ consul_exporter_version }}.linux-{{ go_arch }}.tar.gz
    dest: '{{ _consul_exporter_download_dir }}/consul_exporter-{{ consul_exporter_version }}.linux-{{ go_arch }}.tar.gz'
    checksum: sha256:https://github.com/prometheus/consul_exporter/releases/download/v{{ consul_exporter_version }}/sha256sums.txt
    mode: '0644'
  environment: '{{ proxy_env }}'
  register: _release_download
  until: _release_download is succeeded
  retries: 3
  delay: 2
- name: Extract the selected release
  ansible.builtin.unarchive:
    src: '{{ _consul_exporter_download_dir }}/consul_exporter-{{ consul_exporter_version }}.linux-{{ go_arch }}.tar.gz'
    dest: '{{ _consul_exporter_download_dir }}/consul_exporter-{{ consul_exporter_version }}.linux-{{ go_arch }}'
    remote_src: true
    creates: '{{ _consul_exporter_download_dir }}/consul_exporter-{{ consul_exporter_version }}.linux-{{ go_arch }}/consul_exporter-{{ consul_exporter_version }}.linux-{{ go_arch }}/consul_exporter'
- name: Install the selected release binary
  ansible.builtin.copy:
    src: '{{ _consul_exporter_download_dir }}/consul_exporter-{{ consul_exporter_version }}.linux-{{ go_arch }}/consul_exporter-{{ consul_exporter_version }}.linux-{{ go_arch }}/consul_exporter'
    dest: '{{ consul_exporter_binary_install_dir }}/consul_exporter'
    remote_src: true
    owner: root
    group: root
    mode: '0755'
  notify: restart consul_exporter
- name: copy service unit
  notify: restart consul_exporter
  become: true
  tags: consul_exporter
  ansible.builtin.template:
    src: consul_exporter.service.j2
    dest: /etc/systemd/system/consul_exporter.service
    owner: root
    group: root
    mode: '0644'
- name: ensure service is started and enabled
  become: true
  tags: consul_exporter
  when:
  - consul_exporter_manage_service | bool
  ansible.builtin.systemd_service:
    daemon_reload: true
    name: consul_exporter
    state: '{{ consul_exporter_service_state }}'
    enabled: '{{ consul_exporter_service_enabled }}'
